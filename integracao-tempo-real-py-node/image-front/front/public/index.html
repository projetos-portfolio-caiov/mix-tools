<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / cadastro</title>
</head>
<body>
    <div id="div_cadastro" style="display: flex;">
        <span>Cadastrar</span>
        <input type="text" placeholder="Email Cadastro" id="ipt_email_cad">
        <input type="text" placeholder="Senha Cadastro" id="ipt_senha_cad">
        <button onclick="cadastrar()">Cadastrar</button>
    </div>
    <div id="div_login" style="display: flex;">
        <span>Login</span>
        <input type="text" placeholder="Email Login" id="ipt_email_login">
        <input type="text" placeholder="Senha Login" id="ipt_senha_login">
        <button onclick="logar()">Logar</button>
    </div>
</body>
</html>

<script src="./index.js"></script>
